name: texhelp
description: "TexHelp - Smart Textile Solution (4 Point, Fabric, Shrinkage, Stripe, Yarn, GSM etc.)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 📤 Export ফিচারের জন্য (Excel, PDF, Image)
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  share_plus: ^7.2.1
  # Google AdMob ব্যানার বিজ্ঞাপন দেখানোর জন্য। flutter pub get দিলে ইনস্টল হবে।
  google_mobile_ads: ^5.2.0
  # 📸 GSM Scanner ফিচারের ইন-অ্যাপ ক্যামেরার জন্য
  camera: ^0.10.5+9
  # 🔍 GSM Scanner-এ ট্যাগের সংখ্যা পড়ার জন্য গুগলের OCR প্যাকেজ
  google_mlkit_text_recognition: ^0.13.0

  # 🤖 AI ফিচারের জন্য (AI Color Finder, Machine Library, Fabric Fault, Fabric Type)
  # Gemini API-তে কল করার জন্য
  http: ^1.2.0
  # API Key স্থায়ীভাবে (ডিভাইসে) সেভ রাখার জন্য
  shared_preferences: ^2.2.2
  # AI Settings থেকে Google AI Studio ব্রাউজারে ওপেন করার জন্য
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # 🚀 App icon জেনারেট করার জন্য
  flutter_launcher_icons: ^0.13.1
  # 🎬 Splash screen জেনারেট করার জন্য (Android 12+ সহ সব ভার্সন)
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/fabrics/
    - assets/images/machines/
    - assets/icon/
    - assets/homeicon/
    - assets/Fabric_fault_image/
    - assets/Ready_garments_fault_image/
    - assets/images/Lab/

# ================================
# 📱 App Launcher Icon Config
# ================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon.png"   # background layer (full-bleed)
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"  # safe-zone padded

# ================================
# 🎬 Splash Screen Config
# ================================
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/splash_icon.png"
  android_12:
    image: "assets/icon/splash_icon_android12.png"
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
  android: true
  ios: true
  fullscreen: true
